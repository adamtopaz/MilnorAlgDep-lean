name = "MilnorAlgDep"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MilnorAlgDep"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

# Every file under `MilnorAlgDep/` is built, whether or not the root file imports it.
[[lean_lib]]
name = "MilnorAlgDep"
globs = ["MilnorAlgDep.*"]
